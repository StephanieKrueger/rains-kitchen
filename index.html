<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rain's Kitchen | Coming Soon</title>
  
  <!-- Google Fonts for that elegant aesthetic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Tailwind Config to match your palette -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FDFBF7',
            warmwhite: '#F4F1EB',
            charcoal: '#2D2D2D',
            terracotta: '#E07A5F',
            sage: '#81B29A',
            clay: '#D4A373'
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Smooth fade-in animation for page load */
    .fade-in-up {
      animation: fadeInUp 1s ease-out forwards;
      opacity: 0;
      transform: translateY(20px);
    }
    
    .delay-100 { animation-delay: 0.1s; }
    .delay-200 { animation-delay: 0.2s; }
    .delay-300 { animation-delay: 0.3s; }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body class="bg-warmwhite text-charcoal font-sans antialiased min-h-screen flex flex-col justify-center items-center relative overflow-hidden">

  <!-- Subtle background decorative element -->
  <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
    <div class="absolute -top-[20%] -right-[10%] w-[70%] h-[70%] rounded-full bg-cream blur-3xl opacity-60"></div>
    <div class="absolute -bottom-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-stone-200 blur-3xl opacity-40"></div>
  </div>

  <main class="w-full max-w-2xl mx-auto px-6 text-center z-10">
    
    <!-- Eyebrow text -->
    <p class="fade-in-up text-xs tracking-[0.3em] uppercase text-terracotta mb-6 font-medium">
      Something warm is in the oven
    </p>

    <!-- Main Title -->
    <h1 class="fade-in-up delay-100 font-serif text-5xl md:text-7xl font-normal mb-6 tracking-tight">
      Rain's Kitchen
    </h1>

    <!-- Description -->
    <p class="fade-in-up delay-200 text-charcoal/60 font-light text-base md:text-lg mb-12 max-w-md mx-auto leading-relaxed">
      Curating a collection of simple, honest, and healing dishes. We are prepping the ingredients and will be serving up the full site soon.
    </p>

    <!-- Email Capture Form -->
    <div class="fade-in-up delay-300 max-w-md mx-auto relative h-14">
      
      <!-- Default Form State -->
      <form id="notify-form" class="absolute inset-0 flex transition-opacity duration-500 opacity-100">
        <input 
          type="email" 
          id="email-input"
          placeholder="Enter your email" 
          required
          class="w-full pl-6 pr-32 py-3 h-full bg-cream rounded-full border border-stone-200 focus:outline-none focus:ring-2 focus:ring-terracotta/50 text-sm placeholder-charcoal/40 transition-all shadow-sm"
        >
        <button 
          type="submit" 
          class="absolute right-1 top-1 bottom-1 px-6 bg-charcoal text-cream rounded-full hover:bg-terracotta transition-colors duration-300 text-xs tracking-wider uppercase font-medium"
        >
          Notify Me
        </button>
      </form>

      <!-- Success State (Hidden initially) -->
      <div id="success-message" class="absolute inset-0 flex items-center justify-center bg-sage text-cream rounded-full transition-opacity duration-500 opacity-0 pointer-events-none shadow-sm h-full">
        <span class="flex items-center gap-2 text-sm font-medium tracking-wide">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
          You're on the list!
        </span>
      </div>

    </div>

    <!-- Social Links -->
    <div class="fade-in-up delay-300 mt-16 flex items-center justify-center gap-6 text-charcoal/50">
      <a href="https://www.tiktok.com/@galaxiques" target="_blank" class="hover:text-terracotta transition-colors flex items-center gap-2 text-sm tracking-wide">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.88-2.89 2.89 2.89 0 0 1 2.88-2.89c.3 0 .59.05.86.13V9.2a6.33 6.33 0 0 0-.86-.06A6.34 6.34 0 0 0 2.5 15.48a6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V8.37a8.15 8.15 0 0 0 4.79 1.53V6.69h-1.37z"/></svg>
        Follow on TikTok
      </a>
    </div>

  </main>

  <!-- JavaScript for Form Handling -->
  <script>
    document.getElementById('notify-form').addEventListener('submit', function(e) {
      e.preventDefault(); // Prevents the page from reloading
      
      const email = document.getElementById('email-input').value;
      const form = document.getElementById('notify-form');
      const successMessage = document.getElementById('success-message');
      
      if(email) {
        // Here is where you would link up Formspree or your backend!
        // For now, we'll just run the beautiful UI transition:
        
        // Hide form, show success
        form.classList.remove('opacity-100');
        form.classList.add('opacity-0', 'pointer-events-none');
        
        successMessage.classList.remove('opacity-0', 'pointer-events-none');
        successMessage.classList.add('opacity-100');
        
        // Optional: Reset after a few seconds
        setTimeout(() => {
          form.classList.remove('opacity-0', 'pointer-events-none');
          form.classList.add('opacity-100');
          successMessage.classList.remove('opacity-100');
          successMessage.classList.add('opacity-0', 'pointer-events-none');
          document.getElementById('email-input').value = '';
        }, 4000);
      }
    });
  </script>
</body>
</html>
